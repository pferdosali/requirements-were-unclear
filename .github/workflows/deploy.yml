name: Deploy release
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deployment-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: release/frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy and smoke test
        env:
          IMAGE_URI: ${{ inputs.image }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: bash scripts/deploy-release.sh
      - name: Preserve deployment and rollback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ inputs.environment }}-${{ github.run_attempt }}
          path: release/deployment/
          retention-days: 30
