name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  api:
    name: API - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: implementation/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test -- --ci --coverage

  infra:
    name: Infra - CDK Synth (dev & prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: implementation/infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build mock destination Lambda
        run: |
          cd ../mock-destination
          npm ci
          npm run build
          cp -r node_modules dist/
      - name: Compile TypeScript
        run: npx tsc --noEmit
      - name: CDK Synth (dev)
        run: npx cdk synth -c env=dev --quiet
      - name: CDK Synth (prod)
        run: npx cdk synth -c env=prod --quiet
