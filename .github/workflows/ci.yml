name: Validate and promote
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'implementation/*/package-lock.json'
      - run: bash scripts/validate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: implementation/frontend/dist/
          retention-days: 30
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOYMENTS_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Require configured production approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/production" > /tmp/production-environment.json
          jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))' /tmp/production-environment.json >/dev/null
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY || 'docbridge' }}
          REVISION: ${{ github.sha }}
        run: |
          image="$REGISTRY/$REPOSITORY:$REVISION-${{ github.run_id }}-${{ github.run_attempt }}"
          docker build -t "$image" implementation/api
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$REVISION-${{ github.run_id }}-${{ github.run_attempt }}" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$REGISTRY/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
  staging:
    needs: [validate, build]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  production:
    needs: [build, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
