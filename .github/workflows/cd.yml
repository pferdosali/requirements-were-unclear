name: CD

on:
  push:
    branches: [main]
    paths:
      - 'implementation/**'
      - '.github/workflows/cd.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: docbridge
  ECS_CLUSTER: docbridge

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: implementation/api
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Install CDK dependencies
        working-directory: implementation/infra
        run: npm ci

      - name: CDK Deploy
        working-directory: implementation/infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: npx cdk deploy --all --require-approval=never

      - name: Update ECS services
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service DocBridge-Compute-ApiService --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service DocBridge-Compute-WorkerService --force-new-deployment
